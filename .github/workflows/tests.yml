name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # One Python version, not a matrix: the dependency set here is torch plus
      # rdkit plus torch-geometric, and installing it three times to learn the
      # same thing three times is not worth the minutes.
      #
      # Torch comes from the CPU index. The default wheel drags in the whole
      # CUDA runtime — about 2 GB — for a runner that has no GPU.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check src tests scripts

      # No ChEMBL calls and no trained checkpoints: the tests build their
      # molecules from SMILES literals, so CI does not depend on ChEMBL being
      # up or on a 2 MB CSV being in the repo.
      - name: Test
        run: python -m pytest -q
